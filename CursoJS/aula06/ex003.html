<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa...</title>
    <style>
        h1 {
            background-color: rgb(0, 0, 43);
            padding: 20px;
            text-align: center; /* Comentário em CSS */
            color: rgb(100, 202, 216);
            border-radius: 10px 10px 0px 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        p {
            text-align: center;
            background-color: rgb(100, 202, 216);
            padding: 10px;
            margin-top: -22px;
            border-radius: 0px 0px 10px 10px;
            color: rgb(0, 0, 43);
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1> <!-- Isso é um comentário -->
    <p>Já me livrei da maldição.</p>
    <script>
        var n1 = Number.parseInt(window.prompt('Digite um número: ')) // Number
        var n2 = Number.parseInt(window.prompt('Digite outro número: ')) // Number
        s = n1 + n2
        window.alert(`A soma entre ${n1} + ${n2} é igual a: ${s}`) // Concatenação
        // (number + number) para adição
        // (string + string) para concatenação
    </script>
</body>
</html>
