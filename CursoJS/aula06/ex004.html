<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é o seu nome? ')
        document.write(`Seu nome tem <strong>${nome.length}</strong> letras.<br>`)
        document.write(`Seu nome em maiúsculas: <strong>${nome.toUpperCase()}</strong>.<br>`)
        document.write(`Seu nome em minúsculas: <strong>${nome.toLowerCase()}</strong>.`)
    </script>
</body>
</html>
