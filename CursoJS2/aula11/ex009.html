<head>

<body>

    Qual é o seu país? <input type="text" name="txtn" id="txtn">
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res">

    </div>
    <script>
        function verificar() {
            var pais = window.document.querySelector('input#txtn')
            var res = window.document.querySelector('div#res')
            var n = 'EUA'
            res.innerText(`Vivendo em ${n}`)
            if (n == Brasil) {
                res.innerHTML('Você é Brasileiro!')
            } else {
                res.innerHTML('Você é Estrangeiro!')
            }
        }
    </script>
